# Backend-only Node deployment. Leave Render Root Directory blank so shared/ is accessible.
# Vercel serves client/. Set secret values in the Render dashboard.
services:
  - type: web
    name: dakshsetu
    runtime: node
    rootDir: .
    buildCommand: cd server && npm install --include=dev && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22.x"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: ALLOW_DEMO_LOGIN
        value: "false"
      - key: SEED_DEMO
        value: "false"
